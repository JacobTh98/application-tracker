<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="backdrop backdrop-a"></div>
    <div class="backdrop backdrop-b"></div>

    <main class="app-shell">
      <header class="hero panel">
        <div>
          <p class="eyebrow">Application Tracker</p>
          <h1>Applications</h1>
        </div>

        <div class="hero-stats" id="stats"></div>
      </header>

      <section class="content-grid">
        <section class="panel form-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">New application</p>
              <h2>Add an entry</h2>
            </div>
            <p class="panel-note">Today’s date is added automatically.</p>
          </div>

          <form id="application-form" class="form-grid" autocomplete="off">
            <label>
              <span>Company name</span>
              <input
                id="company"
                name="company"
                type="text"
                placeholder="For example: Acme Inc."
                required
              />
            </label>

            <label>
              <span>Job listing URL</span>
              <input
                id="jobUrl"
                name="jobUrl"
                type="url"
                placeholder="https://..."
                required
              />
            </label>

            <label>
              <span>Location</span>
              <input
                id="location"
                name="location"
                type="text"
                placeholder="For example: Berlin"
                required
              />
            </label>

            <label>
              <span>Expected starting salary</span>
              <input
                id="salary"
                name="salary"
                type="number"
                min="0"
                step="500"
                placeholder="50000"
              />
            </label>

            <button class="primary-button" type="submit">
              Save application
            </button>
          </form>
        </section>

        <section class="panel list-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Overview</p>
              <h2>Your applications</h2>
            </div>
            <button type="button" class="ghost-button" id="export-csv">
              Export CSV
            </button>
          </div>

          <div id="application-list" class="cards"></div>
        </section>
      </section>
    </main>

    <dialog id="edit-dialog" class="dialog-panel">
      <form id="edit-form" class="dialog-form">
        <div class="panel-heading dialog-heading">
          <div>
            <p class="eyebrow">Edit entry</p>
            <h2 id="dialog-title">Edit application</h2>
          </div>
          <button type="button" class="ghost-button" id="close-dialog">
            Close
          </button>
        </div>

        <input type="hidden" id="edit-id" />

        <label>
          <span>Company name</span>
          <input id="edit-company" type="text" required />
        </label>

        <label>
          <span>Job listing URL</span>
          <input id="edit-jobUrl" type="url" required />
        </label>

        <label>
          <span>Location</span>
          <input id="edit-location" type="text" required />
        </label>

        <label>
          <span>Expected starting salary</span>
          <input id="edit-salary" type="number" min="0" step="500" />
        </label>

        <label>
          <span>Status</span>
          <select id="edit-status">
            <option value="open">Open</option>
            <option value="waiting">Waiting</option>
            <option value="interview">Interview</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>

        <fieldset id="interview-fields" class="interview-fields" hidden>
          <legend>Interview appointment</legend>

          <div class="interview-grid">
            <label>
              <span>Datum</span>
              <input id="edit-interview-date" type="date" />
            </label>

            <label>
              <span>Uhrzeit</span>
              <input id="edit-interview-time" type="time" />
            </label>
          </div>

          <label>
            <span>Address</span>
            <input
              id="edit-interview-address"
              type="text"
              placeholder="Street, number, city"
            />
          </label>
        </fieldset>

        <div class="dialog-actions">
          <button type="button" class="ghost-button" id="cancel-edit">
            Cancel
          </button>
          <button type="submit" class="primary-button">Save changes</button>
        </div>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
