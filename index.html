<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bewerbungs-Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="backdrop backdrop-a"></div>
    <div class="backdrop backdrop-b"></div>

    <main class="app-shell">
        <header class="hero panel">
            <div>
                <p class="eyebrow">Bewerbungs-Tracker</p>
                <h1>Bewerbungen</h1>
            </div>

            <div class="hero-stats" id="stats"></div>
        </header>

        <section class="content-grid">
            <section class="panel form-panel">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">Neue Bewerbung</p>
                        <h2>Eintrag hinzufügen</h2>
                    </div>
                    <p class="panel-note">Das aktuelle Datum wird automatisch gesetzt.</p>
                </div>

                <form id="application-form" class="form-grid" autocomplete="off">
                    <label>
                        <span>Name der Firma</span>
                        <input id="company" name="company" type="text" placeholder="Zum Beispiel: Acme GmbH" required>
                    </label>

                    <label>
                        <span>Link zur Stelle</span>
                        <input id="jobUrl" name="jobUrl" type="url" placeholder="https://..." required>
                    </label>

                    <label>
                        <span>Ort</span>
                        <input id="location" name="location" type="text" placeholder="Zum Beispiel: Berlin" required>
                    </label>

                    <label>
                        <span>Gefordertes Einstiegsgehalt</span>
                        <input id="salary" name="salary" type="number" min="0" step="500" placeholder="75000">
                    </label>

                    <button class="primary-button" type="submit">Bewerbung speichern</button>
                </form>
            </section>

            <section class="panel list-panel">
                <div class="panel-heading">
                    <div>
                        <p class="eyebrow">Übersicht</p>
                        <h2>Deine Bewerbungen</h2>
                    </div>
                    <button type="button" class="ghost-button" id="export-csv">CSV exportieren</button>
                </div>

                <div id="application-list" class="cards"></div>
            </section>
        </section>
    </main>

    <dialog id="edit-dialog" class="dialog-panel">
        <form id="edit-form" class="dialog-form">
            <div class="panel-heading dialog-heading">
                <div>
                    <p class="eyebrow">Eintrag bearbeiten</p>
                    <h2 id="dialog-title">Bewerbung bearbeiten</h2>
                </div>
                <button type="button" class="ghost-button" id="close-dialog">Schließen</button>
            </div>

            <input type="hidden" id="edit-id">

            <label>
                <span>Name der Firma</span>
                <input id="edit-company" type="text" required>
            </label>

            <label>
                <span>Link zur Stelle</span>
                <input id="edit-jobUrl" type="url" required>
            </label>

            <label>
                <span>Ort</span>
                <input id="edit-location" type="text" required>
            </label>

            <label>
                <span>Gefordertes Einstiegsgehalt</span>
                <input id="edit-salary" type="number" min="0" step="500">
            </label>

            <label>
                <span>Status</span>
                <select id="edit-status">
                    <option value="offen">Offen</option>
                    <option value="wartend">Wartend</option>
                    <option value="bewerbungsgespraech">Bewerbungsgespräch</option>
                    <option value="abgelehnt">Abgelehnt</option>
                </select>
            </label>

            <fieldset id="interview-fields" class="interview-fields" hidden>
                <legend>Termin für das Bewerbungsgespräch</legend>

                <div class="interview-grid">
                    <label>
                        <span>Datum</span>
                        <input id="edit-interview-date" type="date">
                    </label>

                    <label>
                        <span>Uhrzeit</span>
                        <input id="edit-interview-time" type="time">
                    </label>
                </div>

                <label>
                    <span>Adresse</span>
                    <input id="edit-interview-address" type="text" placeholder="Straße, Hausnummer, Ort">
                </label>
            </fieldset>

            <div class="dialog-actions">
                <button type="button" class="ghost-button" id="cancel-edit">Abbrechen</button>
                <button type="submit" class="primary-button">Änderungen speichern</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
